# Blueprint de Render para el backend de Wanchaq Limpio (ver docs/despliegue.md y docs/adr/0004-*.md).
#
# Este archivo se sube a git, así que NO contiene ningún secreto: las variables con `sync: false` solo declaran el
# NOMBRE; su contenido lo escribes tú en el panel de Render cuando el Blueprint te lo pide.
services:
  - type: web
    name: wanchaq-limpio-api
    runtime: python
    plan: free
    # Debe estar en la MISMA ZONA que tu proyecto de Neon (cada consulta a la base cruza esa distancia): virginia u ohio
    # para la costa este de EE. UU. (Neon us-east-1 / us-east-2), oregon para us-west-2, frankfurt, singapore. Render NO
    # documenta a qué región de AWS corresponde cada una, así que se compara por zona geográfica, no por nombre exacto.
    # Virginia es la más cercana a Perú entre las de Render. Ni la región de Neon ni la de un servicio de Render se pueden
    # cambiar después de creados (se recrean); `verificar_servicios.py` avisa si no coinciden. Ver docs/despliegue.md.
    region: virginia
    # Solo se construye la carpeta backend/: los commits que solo tocan la app Android no redespliegan el servicio.
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # 1 proceso con 4 hilos: el plan gratuito tiene 512 MB de RAM. --timeout 60 cubre el arranque en frío de Neon.
    # ${PORT:-10000}: Render documenta PORT como opcional con 10000 por defecto; así funciona esté o no definida
    # (con `$PORT` a secas, si faltara, gunicorn recibiría "0.0.0.0:" y no arrancaría).
    startCommand: gunicorn wanchaq_limpio.wsgi:application --bind 0.0.0.0:${PORT:-10000} --workers 1 --threads 4 --timeout 60
    # Render lo consulta para saber que el servicio está vivo; /health no toca la base de datos a propósito.
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Django 6.1 exige Python 3.12 o superior. Versión completa (x.y.z), como pide Render en esta variable.
      - key: PYTHON_VERSION
        value: 3.12.10
      # Render inventa un valor aleatorio la primera vez; nunca hace falta conocerlo ni copiarlo.
      - key: SECRET_KEY
        generateValue: true
      # Cadena de conexión de Neon (la escribes tú en el panel).
      - key: DATABASE_URL
        sync: false
      # Credenciales de Cloudinary (las escribes tú en el panel).
      - key: CLOUDINARY_URL
        sync: false
      # Token de /health/servicios: el MISMO que pusiste en backend/.env (lo escribes tú en el panel).
      - key: HEALTH_TOKEN
        sync: false
